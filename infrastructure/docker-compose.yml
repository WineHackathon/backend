services:
  # ============================================================================
  # База данных: PostgreSQL 16
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: wine_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wine_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-wine_db}
    ports:
      - "127.0.0.1:${POSTGRES_PORT_HOST:-5982}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wine_admin} -d ${POSTGRES_DB:-wine_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Кэш и брокер очередей: Redis 7 с персистентностью AOF
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: wine_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================================================
  # Единый Backend API Gateway / BFF
  # ============================================================================
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: wine_backend
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-wine_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change_this_in_production}
      - POSTGRES_DB=${POSTGRES_DB:-wine_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SOMMELIER_SERVICE_URL=http://sommelier:8001
      - ML_SERVICE_URL=http://ml:8002
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-https://s3.firstvds.ru:443}
      - S3_AWS_ACCESS_KEY_ID=${S3_AWS_ACCESS_KEY_ID:-}
      - S3_AWS_SECRET_ACCESS_KEY=${S3_AWS_SECRET_ACCESS_KEY:-}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-wine-hack}
      - S3_REGION_NAME=${S3_REGION_NAME:-ru-central-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../application:/app/application
      - ../backend:/app/backend
    networks:
      - backend-net

  # ============================================================================
  # Специализированный сервис AI-Сомелье (с WebSocket)
  # ============================================================================
  sommelier:
    build:
      context: ..
      dockerfile: sommelier/Dockerfile
    container_name: wine_sommelier
    env_file:
      - ../.env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-wine_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change_this_in_production}
      - POSTGRES_DB=${POSTGRES_DB:-wine_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../application:/app/application
      - ../sommelier:/app/sommelier
    networks:
      - backend-net

  # ============================================================================
  # Nginx Reverse Proxy / API Gateway (Порт 8080)
  # ============================================================================
  gateway:
    image: nginx:1.27-alpine
    container_name: wine_gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8050:8050"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - sommelier
    networks:
      - backend-net

networks:
  backend-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
