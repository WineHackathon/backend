events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # DNS резолвер Docker с периодическим обновлением (предотвращает зависание на старых IP)
    resolver 127.0.0.11 valid=5s ipv6=off;

    server {
        listen 8050;
        server_name localhost;

        set $backend http://backend:8000;
        set $sommelier http://sommelier:8001;

        # -------------------------------------------------------------
        # Swagger Документация и OpenAPI
        # -------------------------------------------------------------
        location /docs {
            proxy_pass $backend$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /openapi.json {
            proxy_pass $backend$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # -------------------------------------------------------------
        # WebSocket AI-Сомелье (/ws/sommelier) с поддержкой Upgrade
        # -------------------------------------------------------------
        location /ws/sommelier {
            proxy_pass $sommelier$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # -------------------------------------------------------------
        # Чекер хакатона (/v1/eval/predict)
        # -------------------------------------------------------------
        location /v1/eval/ {
            proxy_pass $backend$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 15s;
        }

        # -------------------------------------------------------------
        # Единый Backend API (/api/v1/...)
        # -------------------------------------------------------------
        location /api/v1/ {
            proxy_pass $backend$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # -------------------------------------------------------------
        # Gateway Healthcheck
        # -------------------------------------------------------------
        location /health {
            return 200 '{"status":"ok","gateway":"healthy"}';
            add_header Content-Type application/json;
        }

        location / {
            proxy_pass $backend$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
