events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Логирование
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" RT=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Апстримы сервисов модульного монорепозитория
    upstream backend_upstream {
        server backend:8000;
        keepalive 32;
    }

    upstream sommelier_upstream {
        server sommelier:8001;
        keepalive 32;
    }

    upstream minio_upstream {
        server minio:9000;
        keepalive 32;
    }

    upstream frontend_upstream {
        server frontend:80;
        keepalive 32;
    }

    server {
        listen 8080;
        server_name localhost;

        # -------------------------------------------------------------
        # Фронтенд (Web SPA)
        # -------------------------------------------------------------
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # -------------------------------------------------------------
        # WebSocket AI-Сомелье (/ws/sommelier) с поддержкой Upgrade
        # -------------------------------------------------------------
        location /ws/sommelier {
            proxy_pass http://sommelier_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # -------------------------------------------------------------
        # Чекер хакатона (/v1/eval/predict)
        # -------------------------------------------------------------
        location /v1/eval/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
        }

        # -------------------------------------------------------------
        # Единый Backend API (/api/v1/...)
        # -------------------------------------------------------------
        location /api/v1/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # -------------------------------------------------------------
        # MinIO S3 Wine Images
        # -------------------------------------------------------------
        location /s3/ {
            rewrite ^/s3/(.*) /$1 break;
            proxy_pass http://minio_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # -------------------------------------------------------------
        # Gateway Healthcheck
        # -------------------------------------------------------------
        location /health {
            return 200 '{"status":"ok","gateway":"healthy"}';
            add_header Content-Type application/json;
        }
    }
}
